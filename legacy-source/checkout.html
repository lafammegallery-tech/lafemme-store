<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>تسویه حساب | La Femme</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css">

</head>

<body>

<header class="header">

    <div class="container">

        <div class="header-content">

            <a
                href="index.html"
                class="logo">

                <img
                    src="assets/images/logo.png"
                    alt="La Femme">

            </a>

            <nav class="main-nav">

                <ul>

                    <li><a href="index.html">خانه</a></li>

                    <li><a href="products.html">محصولات</a></li>

                    <li><a href="about.html">درباره ما</a></li>

                    <li><a href="contact.html">تماس با ما</a></li>

                </ul>

            </nav>

            <a
                href="contact.html"
                class="contact-button">

                ارتباط با ما

            </a>

        </div>

    </div>

</header>

<div class="market-bar">

    <div class="container">

        <div class="market-wrapper">

            <div class="market-item gold">

                🟡 طلای ۲۴ عیار

                <span id="gold-price">--</span>

            </div>

            <div class="market-item silver">

                ⚪ نقره

                <span id="silver-price">--</span>

            </div>

        </div>

    </div>

</div>

<main>

<section class="checkout-section">

<div class="container">

<h1 class="section-title">

تسویه حساب

</h1>

<div class="checkout-layout">

<div class="checkout-form">

<div class="checkout-card">

<h2>

اطلاعات خریدار

</h2>

<div class="form-group">

<label>

نام و نام خانوادگی

</label>

<input
type="text"
placeholder="نام و نام خانوادگی">

</div>

<div class="form-group">

<label>

شماره موبایل

</label>

<input
type="tel"
placeholder="09xxxxxxxxx">

</div>

<div class="form-group">

<label>

ایمیل (اختیاری)

</label>

<input
type="email"
placeholder="example@email.com">

</div>

<div class="form-group">

<label>

کد ملی

</label>

<input
type="text"
placeholder="کد ملی">

</div>

</div>
<!-- ================= آدرس تحویل ================= -->

<div class="checkout-card">

    <h2>

        آدرس تحویل

    </h2>

    <div class="form-group">

        <label>

            استان

        </label>

        <input
            type="text"
            placeholder="استان">

    </div>

    <div class="form-group">

        <label>

            شهر

        </label>

        <input
            type="text"
            placeholder="شهر">

    </div>

    <div class="form-group">

        <label>

            آدرس کامل

        </label>

        <textarea
            rows="4"
            placeholder="آدرس کامل"></textarea>

    </div>

    <div class="form-group">

        <label>

            کد پستی

        </label>

        <input
            type="text"
            placeholder="کد پستی">

    </div>

</div>


<!-- ================= روش ارسال ================= -->

<div class="checkout-card">

    <h2>

        روش ارسال

    </h2>

    <label class="radio-item">

        <input
            type="radio"
            name="shipping"
            checked>

        ارسال عادی

    </label>

    <label class="radio-item">

        <input
            type="radio"
            name="shipping">

        ارسال ویژه

    </label>

    <label class="radio-item">

        <input
            type="radio"
            name="shipping">

        تحویل حضوری

    </label>

</div>

</div>


<!-- ================= خلاصه سفارش ================= -->

<div class="checkout-summary">

    <div class="checkout-card">

        <h2>

            خلاصه سفارش

        </h2>

        <div class="summary-row">

            <span>

                شمش طلای 995

            </span>

            <span>

                98,450,000 تومان

            </span>

        </div>

        <div class="summary-row">

            <span>

                تعداد

            </span>

            <span>

                1

            </span>

        </div>

        <div class="summary-row">

            <span>

                هزینه ارسال

            </span>

            <span>

                رایگان

            </span>

        </div>

        <hr>

        <div class="summary-total">

            <span>

                مبلغ قابل پرداخت

            </span>

            <strong>

                98,450,000 تومان

            </strong>

        </div>

        <button
            class="btn btn-primary">

            پرداخت و ثبت سفارش

        </button>

    </div>

</div>

</div>

</div>

</section>

</main>
