<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>La Femme | محصول</title>

    <meta
        name="description"
        content="جزئیات محصول">

    <link
        rel="stylesheet"
        href="assets/css/style.css">

</head>

<body>
    <!-- ========================================= -->
<!-- Header -->
<!-- ========================================= -->

<header class="header">

    <div class="container">

        <div class="header-content">

            <a
                href="index.html"
                class="logo">

                <img
                    src="assets/images/logo.png"
                    alt="La Femme">

            </a>

            <nav class="main-nav">

                <ul>

                    <li><a href="index.html">خانه</a></li>

                    <li><a href="products.html">محصولات</a></li>

                    <li><a href="about.html">درباره ما</a></li>

                    <li><a href="contact.html">تماس با ما</a></li>

                </ul>

            </nav>

            <a
                href="contact.html"
                class="contact-button">

                ارتباط با ما

            </a>

        </div>

    </div>

</header>
<!-- ========================================= -->
<!-- Market Bar -->
<!-- ========================================= -->

<div class="market-bar">

    <div class="container">

        <div class="market-wrapper">

            <div class="market-item">

                🟡

                <span id="gold-price">

                    قیمت طلا...

                </span>

            </div>

            <div class="market-item">

                ⚪

                <span id="silver-price">

                    قیمت نقره...

                </span>

            </div>

        </div>

    </div>

</div>
<main>

<section class="product-page">

<div class="container">

<div class="product-wrapper">
    <!-- ========================================= -->
<!-- Product Gallery -->
<!-- ========================================= -->

<div class="product-gallery">

    <img
        id="product-image"
        src=""
        alt="">

</div>



<!-- ========================================= -->
<!-- Product Information -->
<!-- ========================================= -->

<div class="product-info">

    <span
        id="product-badge"
        class="product-badge">

    </span>

    <h1 id="product-name">

    </h1>

    <div class="product-meta">

        <p>

            وزن:

            <span id="product-weight"></span>

            گرم

        </p>

        <p>

            خلوص:

            <span id="product-purity"></span>

        </p>

        <p>

            موجودی:

            <span id="product-stock"></span>

        </p>

    </div>

    <div class="product-price-box">

        <h2>

            قیمت لحظه‌ای

        </h2>

        <div id="product-price">

            ...

        </div>

    </div>

    <a
        href="#"
        class="btn btn-primary">

        افزودن به سبد خرید

    </a>

</div>
<script src="assets/data/products.js"></script>

<script src="assets/data/market.js"></script>

<script src="assets/js/product.js"></script>

</body>

</html>
