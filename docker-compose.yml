services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lafemme
      POSTGRES_USER: lafemme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - lafemme_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lafemme -d lafemme"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lafemme:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/lafemme
      MARKET_PRICE_API_URL: ${MARKET_PRICE_API_URL:-https://arbitrage.aectest.ir/simulation/api/public/v1/prices}
      MARKET_PRICE_API_KEY: ${MARKET_PRICE_API_KEY:?Set MARKET_PRICE_API_KEY in .env}
      MARKET_SYNC_SECRET: ${MARKET_SYNC_SECRET:?Set MARKET_SYNC_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENT_PROVIDER: CARD_TO_CARD
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:3000/api/payment/callback}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8090:3000"
    volumes:
      - lafemme_uploads:/app/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  lafemme_postgres:
  lafemme_uploads:
