services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lafemme
      POSTGRES_USER: lafemme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - lafemme_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lafemme -d lafemme"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lafemme:${POSTGRES_PASSWORD:-change-me}@postgres:5432/lafemme
      GOLD_PRICE_API_URL: ${GOLD_PRICE_API_URL:-https://api.talasea.ir/api/market/getGoldPrice}
      SILVER_PRICE_API_URL: ${SILVER_PRICE_API_URL:-https://api.noghresea.ir/api/market/getSilverPrice}
      MARKET_SYNC_SECRET: ${MARKET_SYNC_SECRET:-replace-with-a-long-random-secret}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-to-a-long-random-secret}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:3000/api/payment/callback}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8090:3000"
    volumes:
      - lafemme_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  lafemme_postgres:
  lafemme_uploads:
